name: 'PR Pilot - AI Code Review'
description: 'Automatically review pull requests using AI. Supports OpenAI, Anthropic, and Google Gemini.'
author: 'Anyrouter232'

branding:
  icon: 'eye'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token for API access. Defaults to the automatic GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}
  provider:
    description: 'AI provider: "openai", "anthropic", or "gemini".'
    required: false
    default: 'openai'
  openai-api-key:
    description: 'OpenAI API key (required if provider is "openai").'
    required: false
    default: ''
  anthropic-api-key:
    description: 'Anthropic API key (required if provider is "anthropic").'
    required: false
    default: ''
  gemini-api-key:
    description: 'Google Gemini API key (required if provider is "gemini").'
    required: false
    default: ''
  model:
    description: 'AI model to use. Defaults vary by provider (gpt-5.4 / claude-sonnet-4-6 / gemini-2.0-flash).'
    required: false
    default: ''
  max-files:
    description: 'Maximum number of files to review. Set to 0 for unlimited.'
    required: false
    default: '20'
  exclude-patterns:
    description: 'Glob patterns of files to exclude (comma-separated). E.g., "*.lock,dist/**"'
    required: false
    default: '*.lock,package-lock.json,yarn.lock,dist/**,*.min.js,*.min.css'
  review-level:
    description: 'Review thoroughness: "concise", "standard", or "thorough".'
    required: false
    default: 'standard'
  custom-prompt:
    description: 'Additional instructions to include in the review prompt.'
    required: false
    default: ''
  post-summary:
    description: 'Whether to post a summary comment on the PR.'
    required: false
    default: 'true'
  fail-on-issues:
    description: 'Whether to fail the action if critical issues are found.'
    required: false
    default: 'false'

outputs:
  review-comment-id:
    description: 'The ID of the review comment posted.'
  issues-found:
    description: 'Number of issues found during review.'
  files-reviewed:
    description: 'Number of files reviewed.'
  tokens-used:
    description: 'Total tokens used by the AI provider.'
  review-duration-ms:
    description: 'Review duration in milliseconds.'
  provider:
    description: 'AI provider used for the review.'

runs:
  using: 'node20'
  main: 'dist/index.js'
